# Suraya v1.4 hardening — npm publish on tag push.
#
# Triggers on tags matching `v*` (e.g. v0.1.0, v1.2.3).
# Gated on the `production` environment, which has kesuraya
# as a required reviewer (set up at the GitHub UI level).
#
# AUTH: npm Trusted Publishing (OIDC) — NO token, NO secret (v1.5, 2026-10-07).
# The npmjs-side trust is configured on the package: npmjs.com → @surayaorg/brain-sdk
# → Settings → Trusted publishing → GitHub Actions → org `surayainc`, repo
# `suraya-brain-sdk-ts`, workflow `publish-npm.yml`, environment `production`.
# npm requires CLI ≥ 11.5.1 and Node ≥ 22.14 for the OIDC exchange (node 24 below
# bundles npm 11). The long-lived NPM_TOKEN path is retired — npm restricts
# 2FA-bypassing tokens (Aug 2026) and token-based direct publishing (Jan 2027).
# NOTE: setup-node deliberately has NO registry-url — its generated .npmrc would
# template an _authToken=${NODE_AUTH_TOKEN} line that shadows the OIDC exchange.
#
# Authoring flow:
#   1. Bump version in package.json
#   2. PR + merge
#   3. git tag vX.Y.Z && git push --tags
#   4. Approve the production deployment in GitHub UI
#   5. Workflow publishes via OIDC — provenance attached automatically

name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: Publish (OIDC trusted publishing — tokenless)
        run: npm publish --access public --provenance
